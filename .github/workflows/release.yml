name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no leading v), e.g. 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Dry run (build + package, skip all publishing)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

# Least privilege by default; every job below declares exactly the permissions it needs
# (contents: write only for the GitHub Release job, id-token: write only for npm/PyPI OIDC).
permissions: {}

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  # ------------------------------------------------------------------ build + package all targets
  build:
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python (jsii-pacmak python target)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Java (jsii-pacmak java target)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "11"

      - name: Setup .NET (jsii-pacmak dotnet target)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup Go (jsii-pacmak go target)
        uses: actions/setup-go@v5
        with:
          go-version: "^1.22"
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # release.yml never regenerates generated/ — it packages what's already committed (and what
      # build.yml already proved matches the pinned schema on this ref). No schema fetch needed.
      - name: Package all targets
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          PACMAK_TARGETS: js,python,java,dotnet,go
        run: pnpm package

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------ GitHub Release
  release_github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes \
            dist/js/*.tgz \
            dist/python/*.whl \
            dist/metrics.json

  # ------------------------------------------------------------------ npm (OIDC trusted publishing)
  release_npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; actions/setup-node's bundled npm on
      # node 24 may be older, so pin explicitly rather than relying on whatever shipped with node.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish
        run: npm publish dist/js/*.tgz --provenance --access public

  # ------------------------------------------------------------------ PyPI (OIDC trusted publishing)
  release_pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
          skip-existing: true

  # ------------------------------------------------------------------ Maven Central
  release_maven:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "11"
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          MAVEN_SERVER_ID: central-ossrh
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}
          MAVEN_OPTS: --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED
        run: npx -p publib@latest publib-maven dist/java

  # ------------------------------------------------------------------ NuGet
  release_nuget:
    name: Publish to NuGet Gallery
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: npx -p publib@latest publib-nuget dist/dotnet

  # ------------------------------------------------------------------ Go (github.com/cdktn-io/cdktn-awscc-go)
  release_go:
    name: Publish to cdktn-awscc-go
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.18.0"
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          # gh-token, aliased GO_GITHUB_TOKEN by the repository manager's PublishingSecretSet —
          # the same secret every provider repo already uses to push its companion -go repo.
          GITHUB_TOKEN: ${{ secrets.GO_GITHUB_TOKEN }}
          GIT_USER_NAME: team-cdk-terrain
          GIT_USER_EMAIL: github-team-cdk-terrain@cdktn.io
          VERSION: ${{ needs.build.outputs.version }}
        run: npx -p publib@latest publib-golang dist/go
