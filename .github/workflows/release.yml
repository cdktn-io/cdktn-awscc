name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (no leading v), e.g. 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Dry run (build + package, skip all publishing)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

# Least privilege by default; every job below declares exactly the permissions it needs
# (contents: write only for the GitHub Release job, id-token: write only for npm/PyPI OIDC).
permissions: {}

env:
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  # ------------------------------------------------------------------ build + package all targets
  build:
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `inputs.version` is passed through `env`, never interpolated into the script, so a
      # dispatcher cannot inject shell syntax; it must also match a strict semver shape.
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid release version '$VERSION' (expected MAJOR.MINOR.PATCH[-prerelease], no leading v)"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python (jsii-pacmak python target)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Setup Java (jsii-pacmak java target)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: corretto
          java-version: "11"

      - name: Setup .NET (jsii-pacmak dotnet target)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.x"

      - name: Setup Go (jsii-pacmak go target)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "^1.22"
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # release.yml never regenerates generated/ — it packages what's already committed (and what
      # build.yml already proved matches the pinned schema on this ref). No schema fetch needed.
      - name: Package all targets
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          PACMAK_TARGETS: js,python,java,dotnet,go
        run: pnpm package

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------ GitHub Release
  release_github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes \
            dist/js/*.tgz \
            dist/python/*.whl \
            dist/metrics.json

  # ------------------------------------------------------------------ npm (OIDC trusted publishing)
  release_npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; actions/setup-node's bundled npm on
      # node 24 may be older, so pin an exact, reviewed version rather than a floating range.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@11.19.1 && npm --version
      - name: Publish
        run: npm publish dist/js/*.tgz --provenance --access public

  # ------------------------------------------------------------------ PyPI (OIDC trusted publishing)
  release_pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/python
          skip-existing: true

  # ------------------------------------------------------------------ Maven Central
  release_maven:
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      # publib is a locked devDependency (exact version, pnpm-lock.yaml) and run from the repo's
      # own install — no `npx ...@latest` resolution in a job that holds publishing credentials.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install publishing tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: corretto
          java-version: "11"
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          MAVEN_SERVER_ID: central-ossrh
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}
          MAVEN_OPTS: --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED
        run: pnpm exec publib-maven dist/java

  # ------------------------------------------------------------------ NuGet
  release_nuget:
    name: Publish to NuGet Gallery
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      # publib is a locked devDependency (exact version, pnpm-lock.yaml) and run from the repo's
      # own install — no `npx ...@latest` resolution in a job that holds publishing credentials.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install publishing tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: pnpm exec publib-nuget dist/dotnet

  # ------------------------------------------------------------------ Go (github.com/cdktn-io/cdktn-awscc-go)
  release_go:
    name: Publish to cdktn-awscc-go
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      # publib is a locked devDependency (exact version, pnpm-lock.yaml) and run from the repo's
      # own install — no `npx ...@latest` resolution in a job that holds publishing credentials.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install publishing tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "^1.18.0"
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          # gh-token, aliased GO_GITHUB_TOKEN by the repository manager's PublishingSecretSet —
          # the same secret every provider repo already uses to push its companion -go repo.
          GITHUB_TOKEN: ${{ secrets.GO_GITHUB_TOKEN }}
          GIT_USER_NAME: team-cdk-terrain
          GIT_USER_EMAIL: github-team-cdk-terrain@cdktn.io
          VERSION: ${{ needs.build.outputs.version }}
        run: pnpm exec publib-golang dist/go
